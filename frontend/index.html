<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI-powered Color-by-Number Mosaic Book Generator for KDP-ready printable books">
    <title>Color-by-Number Mosaic Book Generator</title>
    <link rel="stylesheet" href="/css/main.css">
    <style>
        /* Inline critical styles for fast first paint */
        .app-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: var(--bg-primary);
            flex-direction: column;
            gap: 16px;
        }
        .app-loading-text {
            color: var(--text-secondary);
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body>
    <div id="app" class="app-loading">
        <div class="spinner spinner-lg"></div>
        <div class="app-loading-text">Loading application...</div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="/js/app.js"></script>
</body>
</html>
